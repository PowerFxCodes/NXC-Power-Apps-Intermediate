Screens:
  scrTasks:
    Properties:
      OnVisible: |-
        =If(
            IsEmpty(colAllTasks),
            ClearCollect(
                colAllTasks,
                'Work tracker'
            )// Reloads data if empty - err handling
        );
        Set(
            varAvgCompletedTaskDuration,
            Round(
                Average(
                    Filter(
                        colAllTasks,
                        Progress.Value = "Completed"
                    ),
                    DateDiff(
                        'Start date',
                        'Due date',
                        TimeUnit.Days
                    )
                ),
                2
            )
        );
        With(
            {
                _startDate: Today(),
                _endDate: DateAdd(
                    Today(),
                    7,
                    TimeUnit.Days
                )
            },
            Set(
                varUpcomingTasksCount,
                CountRows(
                    Filter(
                        colAllTasks,
                        'Due date' >= _startDate && 'Due date' <= _endDate
                    )
                )
            )
        )
    Children:
      - galAllTasks:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
          Properties:
            BorderColor: =App.Theme.Colors.Darker10
            Height: =App.Height*.80
            Items: |+
              =   Filter(
                  colAllTasks,
                If(IsBlank(cmbPriority.Selected),true, 
                 Priority.Value in cmbPriority.SelectedItems))
            ShowScrollbar: =false
            TemplateFill: =If(ThisItem.IsSelected||chkSelectTask.Checked,App.Theme.Colors.Lighter80,Color.White)
            TemplateSize: =Parent.Height/5
            Width: =400
            X: =160
            Y: =83
          Children:
            - lblTaskName:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =16
                  Text: =ThisItem.Title
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 86
                  X: =16
                  Y: =18
            - lblTaskProgress:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =ThisItem.Progress.Value
                  VerticalAlign: =VerticalAlign.Top
                  Width: =lblTaskName.Width
                  X: =lblTaskName.X
                  Y: =50
            - lblTaskDueDate:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: |-
                    =Text(
                    ThisItem.'Due date',"dd/mm/yyyy")
                  VerticalAlign: =VerticalAlign.Top
                  Width: =lblTaskName.Width
                  X: =lblTaskName.X
                  Y: =79
            - rectSeparator2:
